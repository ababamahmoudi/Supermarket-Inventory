<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line editor, phone</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b59c3;text-decoration:none}a:hover{color:#1f4699}
button,input{font-family:inherit}
label{min-width:0}input{min-width:0;width:100%}
</style>
</head>
<body>
<div role="dialog" aria-label="Edit line 3" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#ffffff;color:#141a2b;font-family:Manrope, system-ui, sans-serif;font-size:14px;line-height:20px;font-weight:500">
  <header style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e6e7eb">
    <a href="Phone.html" aria-label="Close" style="width:40px;height:40px;border-radius:12px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#141a2b"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="display:flex;flex-direction:column;min-width:0"><span style="font-size:12px;line-height:16px;font-weight:600;color:#5a6070">Line 3 of 10</span><span style="font-weight:800;font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Pickled Cucumbers 12 × 660 g</span></div>
  </header>

  <div style="padding:16px 16px 150px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#fdf3e2;color:#9a5b00;font-weight:600;font-size:13px"><span style="width:8px;height:8px;margin-top:6px;border-radius:999px;background:#e08a00;flex:0 0 auto"></span>2 highlighted fields: compare them with the original.</div>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;padding-bottom:8px;border-bottom:1px solid #e6e7eb;font-size:15px;line-height:20px;font-weight:800">Product</h2>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#5a6070">English name</span><input value="Pickled Cucumbers 12 × 660 g" style="height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #dcdfe5;background:#f0f1f4;padding:0 14px;font:inherit;color:#141a2b"></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#5a6070">Persian name <span style="font-weight:500">(optional)</span></span><input dir="rtl" style="height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #dcdfe5;background:#f0f1f4;padding:0 14px;font:inherit;color:#141a2b"></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#5a6070">Pricing category</span><span style="height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #dcdfe5;background:#f0f1f4;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#5a6070">Choose…<span aria-hidden="true">⌄</span></span></label>
    </section>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;padding-bottom:8px;border-bottom:1px solid #e6e7eb;font-size:15px;line-height:20px;font-weight:800">Quantity and cost</h2>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#5a6070">Cases</span><input value="1" style="height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #dcdfe5;background:#f0f1f4;padding:0 14px;font:inherit;color:#141a2b;text-align:end"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:600;color:#5a6070">Units per case<span tabindex="0" role="img" aria-label="Check this against the original" title="The AI wasn't sure about this value. Compare it with the original." style="display:inline-flex;flex:0 0 auto;width:18px;height:18px;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#fdf3e2" stroke="#e08a00" stroke-width="2"></circle><path d="M12 7.5v5.5" stroke="#9a5b00" stroke-width="2.4" stroke-linecap="round"></path><circle cx="12" cy="16.6" r="1.4" fill="#9a5b00"></circle></svg></span></span><input value="12" style="height:44px;box-sizing:border-box;border-radius:12px;border:2px solid #e08a00;background:#ffffff;padding:0 13px;font:inherit;color:#141a2b;text-align:end"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:600;color:#5a6070">Case cost<span tabindex="0" role="img" aria-label="Check this against the original" title="The AI wasn't sure about this value. Compare it with the original." style="display:inline-flex;flex:0 0 auto;width:18px;height:18px;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#fdf3e2" stroke="#e08a00" stroke-width="2"></circle><path d="M12 7.5v5.5" stroke="#9a5b00" stroke-width="2.4" stroke-linecap="round"></path><circle cx="12" cy="16.6" r="1.4" fill="#9a5b00"></circle></svg></span></span><input value="37.8000" style="height:44px;box-sizing:border-box;border-radius:12px;border:2px solid #e08a00;background:#ffffff;padding:0 13px;font:inherit;color:#141a2b;text-align:end"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#5a6070">Unit cost</span><input value="3.1500" style="height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #dcdfe5;background:#f0f1f4;padding:0 14px;font:inherit;color:#141a2b;text-align:end"></label>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#f4f5f7;font-size:13px"><span style="color:#5a6070">12 units · paper total <strong style="color:#141a2b">$37.80</strong></span><span style="color:#197d44;font-weight:700">✓ Matches</span></div>
    </section>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e6e7eb;box-shadow:0 -8px 24px rgba(20,26,43,0.08);padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px">
    <button type="button" style="height:48px;border-radius:12px;border:0;background:#2b59c3;color:#ffffff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Confirm line</button>
    <div style="display:flex;gap:8px">
      <button type="button" style="flex:1 1 0;height:40px;border-radius:12px;border:1px solid #dcdfe5;background:#ffffff;color:#141a2b;font-size:13px;font-weight:700">Report short</button>
      <button type="button" style="flex:1 1 0;height:40px;border-radius:12px;border:0;background:#fce9e7;color:#b42318;font-size:13px;font-weight:700">Remove line</button>
    </div>
  </div>
</div>
</body>
</html>
