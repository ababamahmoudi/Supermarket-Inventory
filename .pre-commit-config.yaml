repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: foundation-lint
        name: Python, frontend, and Compose checks
        entry: make lint
        language: system
        pass_filenames: false
        files: '^(backend/|frontend/|seed/.*\.py$|scripts/|docker-compose\.yml$|Makefile$)'
      - id: prototype-lint
        name: Prototype TypeScript and formatting checks
        entry: npm --prefix prototype run lint
        language: system
        pass_filenames: false
        files: '^prototype/'
